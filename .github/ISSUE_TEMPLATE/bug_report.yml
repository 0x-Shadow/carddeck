name: Bug report
description: Report a reproducible problem in Carddeck
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, API keys, private deck content, databases, or uploaded assets.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include safe error text, not private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: main / commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence using sample content.
    validations:
      required: true